# Publish to Maven Central (Sonatype Central Portal) on a v* tag.
#
# THREE JOBS, EACH WITH ONLY THE PRIVILEGE IT NEEDS (workspace C30; owner, 2026-11-08:
# "yes use the C30 split workflow"; models: loader-dart cb7bc26, loader-go 2ff71ef):
#
#   checks   contents: read. Tokenless clone. Runs everything that executes third-party
#            code for the gate: the build, the tests, the compatibility gate (which also
#            runs the previous tag's tests). No secret, no write token.
#   publish  contents: read. A fresh runner and a tokenless clone; refuses unless the tag
#            still points at the commit `checks` passed. Runs only the Gradle publish task
#            (tests skipped). The four publishing secrets exist in that one step's env.
#   release  contents: write. No build: a tokenless clone (for the script only), the pinned JDK +
#            Kotlin, then scripts/github-release.main.kts — GitHub's REST API with the job's
#            GITHUB_TOKEN, JDK classes only (workspace H30: no GitHub CLI, in CI too). It
#            requires the tag on GitHub to peel to github.sha before any write, then creates
#            the release/<tag> branch and the GitHub Release when missing, and reads both back.
#
# Every download is pinned by version AND sha256 (the JDK, the Kotlin compiler; the Gradle
# distribution through gradle-wrapper.properties' distributionSha256Sum). No `uses:` steps.
# No `concurrency:` group: a later run queues instead of cancelling one mid-publish (C30 (2)).
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   MAVEN_CENTRAL_USERNAME   Central Portal user token name   (→ ORG_GRADLE_PROJECT_mavenCentralUsername)
#   MAVEN_CENTRAL_PASSWORD   Central Portal user token secret (→ ORG_GRADLE_PROJECT_mavenCentralPassword)
#   GPG_PRIVATE_KEY          ASCII-armored GPG private key    (→ ORG_GRADLE_PROJECT_signingInMemoryKey)
#   GPG_PASSPHRASE           passphrase for that GPG key      (→ ORG_GRADLE_PROJECT_signingInMemoryKeyPassword)
#
# The com.vanniktech.maven.publish plugin reads the ORG_GRADLE_PROJECT_* names directly
# (in-memory signing + Central Portal upload); no settings.xml or secring.gpg file is needed.

name: Publish

on:
  push:
    tags:
      - 'v*'
  # Manual trigger: Actions → Publish → "Run workflow", with a TAG (v0.2.0 or later) picked
  # from the ref dropdown. `checks` refuses a branch ref.
  workflow_dispatch: {}

env:
  JDK_URL: https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jdk_x64_linux_hotspot_25.0.5_8.tar.gz
  JDK_SHA256: 68982529869257d0ee6b824ec5aa270ff8b118bb438670da0b97ebdab178d7fb
  KOTLINC_URL: https://github.com/JetBrains/kotlin/releases/download/v2.2.0/kotlin-compiler-2.2.0.zip
  KOTLINC_SHA256: 1adb6f1a5845ba0aa5a59e412e44c8e405236b957de1a9683619f1dca3b16932

jobs:
  checks:
    name: Checks (tests + compatibility gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse a non-tag ref
        run: |
          case "${GITHUB_REF}" in refs/tags/v*) ;; *) echo "❌ not a v* tag: ${GITHUB_REF}"; exit 1 ;; esac

      - name: Clone the tag (no token)
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "${GITHUB_REF_NAME}" "https://github.com/${GITHUB_REPOSITORY}.git" .
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}" || { echo "❌ the tag moved since the run started"; exit 1; }
          # The compatibility gate compares against the previous tag: fetch every tag (shallow).
          git fetch --depth=1 origin 'refs/tags/*:refs/tags/*'

      - name: Install JDK 25.0.5+8 (Temurin, pinned)
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-all-errors "${JDK_URL}" -o /tmp/jdk.tar.gz
          echo "${JDK_SHA256}  /tmp/jdk.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/jdk" && tar -xzf /tmp/jdk.tar.gz -C "$HOME/jdk" --strip-components=1
          echo "JAVA_HOME=$HOME/jdk" >> "$GITHUB_ENV"
          echo "$HOME/jdk/bin"       >> "$GITHUB_PATH"

      - name: Install the Kotlin 2.2.0 compiler (pinned; for scripts/compat.main.kts)
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-all-errors "${KOTLINC_URL}" -o /tmp/kotlinc.zip
          echo "${KOTLINC_SHA256}  /tmp/kotlinc.zip" | sha256sum -c -
          unzip -q /tmp/kotlinc.zip -d "$HOME"
          echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          java -version
          kotlin -version
          chmod +x gradlew && ./gradlew --version

      # check = tests + the api/ snapshot check
      - name: Check
        run: ./gradlew --no-daemon check

      # Self-test of the gate's logic, then this tag against the previous one: version
      # agreement, the SPEC/API floor, the Breaking Changes row, and the previous tag's
      # tests against this library (cmem/compat-gate.md).
      - name: Compatibility gate
        run: |
          kotlin scripts/compat.main.kts selftest
          kotlin scripts/compat.main.kts release

      # The release job's script, against its mock API (no network, no token).
      - name: Release script self-test
        run: kotlin scripts/github-release.main.kts selftest

  publish:
    name: Publish to Maven Central
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the tag (no token) and require the tested commit
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "${GITHUB_REF_NAME}" "https://github.com/${GITHUB_REPOSITORY}.git" .
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}" || { echo "❌ the tag no longer points at the commit checks passed"; exit 1; }

      - name: Install JDK 25.0.5+8 (Temurin, pinned)
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-all-errors "${JDK_URL}" -o /tmp/jdk.tar.gz
          echo "${JDK_SHA256}  /tmp/jdk.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/jdk" && tar -xzf /tmp/jdk.tar.gz -C "$HOME/jdk" --strip-components=1
          echo "JAVA_HOME=$HOME/jdk" >> "$GITHUB_ENV"
          echo "$HOME/jdk/bin"       >> "$GITHUB_PATH"

      # The only step that sees the secrets. Tests already ran in `checks`; skipping them
      # here keeps the test suite (and its dependencies) away from the signing key.
      - name: Publish (signed) to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -x test publishAllPublicationsToMavenCentralRepository

  release:
    name: Release branch + GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Tokenless: the clone only supplies the script, at the commit that was tested.
      - name: Clone the tag (no token) and require the published commit
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "${GITHUB_REF_NAME}" "https://github.com/${GITHUB_REPOSITORY}.git" .
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}" || { echo "❌ the tag no longer points at ${GITHUB_SHA}"; exit 1; }

      - name: Install JDK 25.0.5+8 (Temurin, pinned)
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-all-errors "${JDK_URL}" -o /tmp/jdk.tar.gz
          echo "${JDK_SHA256}  /tmp/jdk.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/jdk" && tar -xzf /tmp/jdk.tar.gz -C "$HOME/jdk" --strip-components=1
          echo "JAVA_HOME=$HOME/jdk" >> "$GITHUB_ENV"
          echo "$HOME/jdk/bin"       >> "$GITHUB_PATH"

      - name: Install the Kotlin 2.2.0 compiler (pinned)
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-all-errors "${KOTLINC_URL}" -o /tmp/kotlinc.zip
          echo "${KOTLINC_SHA256}  /tmp/kotlinc.zip" | sha256sum -c -
          unzip -q /tmp/kotlinc.zip -d "$HOME"
          echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"

      # The tag must peel to github.sha on GitHub before anything is written; an existing branch
      # or Release is kept, so a re-run of this job is safe.
      - name: Create release/<tag> branch and GitHub Release (REST API)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: kotlin scripts/github-release.main.kts release "${GITHUB_REF_NAME}" "${GITHUB_SHA}"
