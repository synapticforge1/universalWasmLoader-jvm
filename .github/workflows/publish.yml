# Publish to Maven Central (Sonatype Central Portal) on a v* tag.
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ run:-ONLY WORKFLOW (historical constraint, now kept by choice).             │
# │                                                                             │
# │ Under the personal `jrmarcum` account, the Actions policy permitted ONLY    │
# │ `jrmarcum`-owned actions, so any third-party `uses:` step (actions/checkout,│
# │ actions/setup-java, …) caused a `startup_failure`. Every step here is       │
# │ therefore a plain `run:` step — checkout via `git clone`, install the JDK   │
# │ via `run:`, and use the committed Gradle wrapper (`./gradlew`).              │
# │                                                                             │
# │ Since the move to the `synapticforge1` org (2026-10), the org policy is     │
# │ "Allow all actions and reusable workflows", so `uses:` steps would now be   │
# │ allowed. The run:-only form is kept because it is the proven release path.  │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   MAVEN_CENTRAL_USERNAME   Central Portal user token name   (→ ORG_GRADLE_PROJECT_mavenCentralUsername)
#   MAVEN_CENTRAL_PASSWORD   Central Portal user token secret (→ ORG_GRADLE_PROJECT_mavenCentralPassword)
#   GPG_PRIVATE_KEY          ASCII-armored GPG private key    (→ ORG_GRADLE_PROJECT_signingInMemoryKey)
#   GPG_PASSPHRASE           passphrase for that GPG key      (→ ORG_GRADLE_PROJECT_signingInMemoryKeyPassword)
#
# The com.vanniktech.maven.publish plugin reads the ORG_GRADLE_PROJECT_* names
# directly (in-memory signing + Central Portal upload); no settings.xml or
# secring.gpg file is needed.

name: Publish

on:
  push:
    tags:
      - 'v*'
  # Manual trigger: Actions → Publish → "Run workflow". Pick the TAG (e.g. v0.1.2)
  # from the ref dropdown to reproduce a tag-push run exactly (release bookkeeping
  # included). Running it against a branch publishes but skips the release steps.
  workflow_dispatch: {}

jobs:
  publish:
    name: Test and Publish to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # --- Checkout (run:, not actions/checkout) -------------------------------
      - name: Clone repository at tag
        run: |
          git clone --depth=1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
          # The compatibility gate compares against the previous tag: fetch every tag (shallow).
          git fetch --depth=1 origin 'refs/tags/*:refs/tags/*'

      # --- JDK install (run:, not actions/setup-java) --------------------------
      # The build targets JVM 24 with a JDK 25 toolchain (requires JDK 24+).
      # ubuntu-latest preinstalls several Temurin JDKs under /usr/lib/jvm; pick a
      # 24+ one if present, otherwise download Temurin 25 via `run:`.
      - name: Set up JDK 24+ (Temurin)
        run: |
          set -euo pipefail
          # Prefer an already-installed Temurin 24/25 to avoid a network download.
          found=""
          for d in /usr/lib/jvm/temurin-25* /usr/lib/jvm/temurin-24* \
                   /usr/lib/jvm/*-25-* /usr/lib/jvm/*-24-*; do
            if [ -x "$d/bin/javac" ]; then found="$d"; break; fi
          done
          if [ -z "$found" ]; then
            echo "No preinstalled JDK 24+ found — downloading Temurin 25."
            url="https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse"
            mkdir -p "$HOME/jdk"
            curl -fsSL "$url" -o /tmp/jdk.tar.gz
            tar -xzf /tmp/jdk.tar.gz -C "$HOME/jdk" --strip-components=1
            found="$HOME/jdk"
          fi
          echo "Using JAVA_HOME=$found"
          echo "JAVA_HOME=$found"      >> "$GITHUB_ENV"
          echo "$found/bin"            >> "$GITHUB_PATH"

      # --- Kotlin CLI for scripts/compat.main.kts (run:, no setup action) ------
      - name: Set up the kotlin command
        run: |
          set -euo pipefail
          if ! command -v kotlin >/dev/null 2>&1; then
            echo "kotlin not preinstalled — downloading the Kotlin 2.2.0 compiler."
            curl -fsSL "https://github.com/JetBrains/kotlin/releases/download/v2.2.0/kotlin-compiler-2.2.0.zip" -o /tmp/kotlinc.zip
            unzip -q /tmp/kotlinc.zip -d "$HOME"
            echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"
          fi

      - name: Show toolchain
        run: |
          java -version
          kotlin -version
          ./gradlew --version

      # --- Test gate (check = tests + the api/ snapshot check) -------------------
      - name: Check
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon check

      # --- Compatibility gate (cmem/compat-gate.md) ------------------------------
      # Self-test of the gate's logic, then this tag against the previous one:
      # version agreement, the SPEC/API floor, the Breaking Changes row, and the
      # previous tag's tests against this library. Blocks the publish on failure.
      - name: Compatibility gate
        run: |
          kotlin scripts/compat.main.kts selftest
          kotlin scripts/compat.main.kts release

      # --- Publish (signed) to Maven Central -----------------------------------
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./gradlew --no-daemon publishAllPublicationsToMavenCentralRepository

      # --- Release bookkeeping (run:, gh is preinstalled on the runner) --------
      # Only meaningful for a tag ref (push of v*, or a manual run with a tag
      # selected). A branch-dispatch publishes the artifact but skips these.
      - name: Create release branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/${GITHUB_REF_NAME}"
          git push origin "release/${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --target "release/${GITHUB_REF_NAME}" \
            --generate-notes
